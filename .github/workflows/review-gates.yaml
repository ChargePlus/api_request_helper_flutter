name: Review gates

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: review-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gates:
    name: Review gates
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR review evidence
        # The checker and its config come from the PR's base commit, so a PR
        # cannot loosen the check that judges it. A base without a checker
        # yet (the PR that adds it) falls back to the PR's copy, with a warning.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          checker="$RUNNER_TEMP/review-gates/.github"
          mkdir -p "$checker/scripts"
          if git cat-file -e "$BASE_SHA:.github/scripts/review_gates_check.py" 2>/dev/null; then
            git show "$BASE_SHA:.github/scripts/review_gates_check.py" > "$checker/scripts/review_gates_check.py"
            if git cat-file -e "$BASE_SHA:.github/review-gates.json" 2>/dev/null; then
              git show "$BASE_SHA:.github/review-gates.json" > "$checker/review-gates.json"
            fi
            echo "Checking with the base branch's checker and config ($BASE_SHA)."
          else
            cp .github/scripts/review_gates_check.py "$checker/scripts/"
            if [ -f .github/review-gates.json ]; then cp .github/review-gates.json "$checker/"; fi
            echo "::warning::The base branch has no review gates checker yet, so this PR's own copy runs. Later PRs are checked by the base branch's copy."
          fi
          python3 "$checker/scripts/review_gates_check.py"
