# Repo settings for .claude/scripts/codex.sh (sourced bash).
BASE=origin/develop
WORKTREE='$(dirname "$main_root")/api_request_helper_flutter-worktrees/$type/$name'
# The Flutter SDK's own cache. Resolve symlinks (Homebrew, fvm); a wrapper
# shim (asdf, mise) needs Flutter itself to say where its root is.
_flutter=$(command -v flutter 2>/dev/null || true)
if [ -n "$_flutter" ]; then
  _root=$(cd "$(dirname "$(readlink -f "$_flutter")")/.." && pwd)
  [ -d "$_root/bin/cache" ] || _root=$(flutter --version --machine 2>/dev/null |
    python3 -c 'import json, sys; print(json.load(sys.stdin)["flutterRoot"])' 2>/dev/null || true)
  [ -n "$_root" ] && WRITE_DIRS=("$_root/bin/cache")
fi
GATES='the CI gates from `./script.sh` option 3: `dart format --line-length 80 --set-exit-if-changed lib test`, `flutter analyze lib test`, `very_good test -j 4 --coverage --test-randomize-ordering-seed random` (CI floor: 30% coverage). Behavior changes (retries, headers, status-to-exception mapping) count as breaking (CLAUDE.md); touching logging needs a test proving the new sensitive value is redacted.'
